# =============================================================================
# SensorKit — DAO-01 Docker stack
#
# One agent + controller driving the DAO-01 sensor: an Alpaca service
# (GMX600 weather on the host), a Node Platform / Edge service (Weather +
# Enclosure + Mount + Focuser + Rotator), and the native Cosmos-8k camera
# service (dao_camera.py) running bare-metal on the Windows host — the file is
# mounted into every container below only so the config parser can import it.
# Programs: Burr, Otto, UDL. Plus SENPAI analyzer.
#
#   Build + start:  docker compose -f docker-compose.yaml up -d --build
#   Logs:           docker compose -f docker-compose.yaml logs -f agent
#   Stop:           docker compose -f docker-compose.yaml down
# =============================================================================
name: sensorkit

x-common-environment: &common-env
  NATS_URL: nats://nats:4222
  SENSORKIT_CONFIG: /sensorkit.yaml
#  SENSORKIT_DEBUG: 1

x-config-file: &config-file "./dao-01.yaml:/sensorkit.yaml:ro"
# dao-01.yaml's sensorkit.imports references /opt/sk/dao_camera.py, so the file
# must be importable in every container that parses the config.
x-camera-file: &camera-file "./dao_camera.py:/opt/sk/dao_camera.py:ro"
x-env-file:    &env-file    "C:/sk/.env:/opt/sk/.env:ro"
x-data-dir:    &data-dir    "C:/sk/data:/opt/sk/data"

services:
  nats:
    image: nats:2.12-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-js -m 8222"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8222/varz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # One-shot: build the image, load the unified config into NATS KV, exit.
  config:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        EXTRAS: alpaca,node-platform,burr,otto,udl,senpai,slack,sky-transmission
    image: sensorkit
    pull_policy: never
    command: config load -v /sensorkit.yaml
    environment:
      <<: *common-env
    volumes:
      - *config-file
      - *camera-file
    depends_on:
      nats:
        condition: service_healthy

  # Sensor controller (sensors[].id == DAO-01) — orchestrates via NATS.
  controller:
    image: sensorkit
    pull_policy: never
    command: service run DAO-01 sensorkit.sensor
    environment:
      <<: *common-env
    volumes:
      - *config-file
      - *camera-file
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully

  # Alpaca service, running on the Windows host, reached via host.docker.internal.
  alpaca:
    image: sensorkit
    pull_policy: never
    command: service run alpaca_service sensorkit.alpaca.service
    environment:
      <<: *common-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - *config-file
      - *camera-file
      - *data-dir
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully

  # Node Platform / Edge service running on the remote Edge host.
  node_platform:
    image: sensorkit
    pull_policy: never
    command: service run node_platform_service sensorkit.node_platform.service
    environment:
      <<: *common-env
    volumes:
      - *config-file
      - *camera-file
      - *env-file
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully

  # Burr calibration program (burr[].id == Burr).
  burr:
    image: sensorkit
    pull_policy: never
    command: service run Burr sensorkit.burr.program
    environment:
      <<: *common-env
    volumes:
      - *config-file
      - *camera-file
      - *data-dir
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully

  # Otto satellite tasking program (otto[].id == Otto).
  otto:
    image: sensorkit
    pull_policy: never
    command: service run Otto sensorkit.otto.program
    environment:
      <<: *common-env
    volumes:
      - *config-file
      - *camera-file
      - *env-file
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully

  # UDL tasking program (udl[].id == UDL). Basic auth via .env.
  udl:
    image: sensorkit
    pull_policy: never
    command: service run UDL sensorkit.udl.service
    environment:
      <<: *common-env
    volumes:
      - *config-file
      - *camera-file
      - *env-file
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully

  # SENPAI streak analyzer (senpai.id == SENPAI). Built from the config image +
  # astrometry.net (solve-field). Needs /path/to/senpai_DAO-01.yaml to exist and
  # /path/to/catalogs for the star catalog + astrometry indices.
  senpai:
    build:
      additional_contexts:
        - base=service:config
      dockerfile_inline: |
        FROM base
        RUN apt-get update \
         && apt-get install -y --no-install-recommends astrometry.net \
         && rm -rf /var/lib/apt/lists/*
    image: sensorkit-senpai
    pull_policy: never
    command: service run SENPAI sensorkit.senpai.service
    environment:
      <<: *common-env
    volumes:
      - *config-file
      - *camera-file
      - *data-dir
      - "C:/sk/senpai_DAO-01.yaml:/opt/sk/senpai_DAO-01.yaml:ro"
      - "C:/sk/catalogs:/opt/sk/catalogs:ro"
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully

  # Automation agent — schedules tasking across the controller's programs.
  agent:
    image: sensorkit
    pull_policy: never
    command: service run agent sensorkit.auto.agent
    environment:
      <<: *common-env
    volumes:
      - *config-file
      - *camera-file
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully
      controller:
        condition: service_started
      alpaca:
        condition: service_started
      node_platform:
        condition: service_started

  sky_transmission:
    image: sensorkit
    pull_policy: never
    command: service run OMEA sensorkit.sky_transmission.service
    environment:
      <<: *common-env
    ports:
      - "8200:8200"
    volumes:
      - *config-file
      - *camera-file
      - *data-dir
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully

  # Slack notifications (slack.id == slack_service) — needs .env for the token.
  slack:
    image: sensorkit
    pull_policy: never
    command: service run slack_service sensorkit.slack.service
    environment:
      <<: *common-env
    volumes:
      - *config-file
      - *camera-file
      - *env-file
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully

  # Web API (services[].id == webapi).
  webapi:
    image: sensorkit
    pull_policy: never
    command: service run WebAPI sensorkit.webapi
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    volumes:
      - *config-file
      - *camera-file
      - *data-dir
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully