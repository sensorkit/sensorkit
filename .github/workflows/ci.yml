name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Main should only go red if the package is broken, so the style checks warn
  # there instead of failing.
  SOFT_CHECKS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          cache-suffix: lint

      - name: Install ruff
        run: uv sync --locked --only-group lint

      - name: Lint sources
        continue-on-error: ${{ env.SOFT_CHECKS == 'true' }}
        run: uv run --no-sync ruff check

  imports:
    name: Import layering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          cache-suffix: imports

      - name: Install import-linter
        run: |
          uv sync --locked --only-group imports

          # grimp locates the root package through the import system, so sensorkit
          # has to be importable.
          uv pip install --no-deps -e .

      - name: Check import layering
        continue-on-error: ${{ env.SOFT_CHECKS == 'true' }}
        run: uv run --no-sync lint-imports

  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          cache-suffix: complexity

      - name: Install complexipy
        run: uv sync --locked --only-group complexity

      - name: Check code complexity
        continue-on-error: ${{ env.SOFT_CHECKS == 'true' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base=$(git merge-base "origin/$BASE_REF" HEAD || true) ;;
            push)         base="$BEFORE" ;;
            *)            base="" ;;
          esac

          # The pre-push tip is absent after a force push, and is the null SHA
          # on a branch's first push.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse --verify --quiet HEAD^ || true)
          fi

          if [ -z "$base" ]; then
            echo "No comparable base commit; skipping."
            exit 0
          fi

          uv run --no-sync complexipy --no-ignore --failed --diff "$base"

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Device drivers log non-ASCII (degree signs); keep Windows off cp1252.
      PYTHONUTF8: "1"
      COV: ${{ matrix.os == 'ubuntu-latest' && '--cov' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          cache-suffix: test

      - name: Install
        # No systemd on the runner; degrades gracefully in code.
        # CPU torch keeps the CUDA libraries out of the runner cache.
        run: uv sync --locked --all-extras --no-extra systemd --group torch-cpu --dev

      - name: Cache JPL ephemeris
        uses: actions/cache@v6
        with:
          path: de421.bsp
          key: de421-bsp-${{ runner.os }}

      - name: Fetch JPL ephemeris
        run: uv run --no-sync python -c "from skyfield.api import load; load('de421.bsp')"

      - name: Run tests
        shell: bash
        run: uv run --no-sync pytest -q --timeout=300 $COV 2>&1 | tee test.log

      - name: Summarize tests
        if: ${{ !cancelled() && hashFiles('test.log') != '' }}
        shell: bash
        run: |
          {
            echo "### Tests"
            echo
            echo '```'
            tail -1 test.log

            # The data file pytest-cov leaves behind yields the total on its
            # own, so the per-file table stays out of the log.
            if [ -n "$COV" ]; then
              echo "coverage: $(uv run --no-sync coverage report --format=total 2>/dev/null || echo n/a)%"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build coverage reports
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          # Core sits at the report root so its published URL is unchanged, and
          # each module gets a subdirectory named for it.
          mkdir -p coverage-report
          uv run --no-sync coverage xml --include='core/src/*' -o coverage-report/coverage.xml
          uv run --no-sync coverage html --include='core/src/*' -d coverage-report --quiet

          {
            echo "### Coverage"
            echo
            echo "| Scope | Line coverage |"
            echo "| --- | --- |"
            echo "| core | $(uv run --no-sync coverage report --format=total --include='core/src/*')% |"
          } >> "$GITHUB_STEP_SUMMARY"

          for path in modules/*/; do
            name=$(basename "$path")
            out="coverage-report/$name"
            mkdir -p "$out"

            # A module scaffolded without sources has nothing to measure.
            if ! uv run --no-sync coverage xml --include="modules/$name/*" -o "$out/coverage.xml"; then
              rm -rf "$out"
              continue
            fi

            uv run --no-sync coverage html --include="modules/$name/*" -d "$out" --quiet

            total=$(uv run --no-sync coverage report --format=total --include="modules/$name/*")
            echo "| $name | $total% |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload coverage
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage-report/
          if-no-files-found: ignore

  pages:
    name: Docs
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          cache-suffix: docs

      - name: Install zensical
        run: uv sync --locked --only-group docs

      - name: Build docs
        run: uv run --no-sync zensical build

      - uses: actions/download-artifact@v7
        with:
          name: coverage
          path: coverage-report/

      # Pages replaces the whole site on every deploy, so the report has to be
      # assembled alongside the docs rather than published on its own.
      - name: Attach the coverage report
        run: |
          mkdir -p site/coverage
          cp -r coverage-report/. site/coverage/

          # Every report directory carries its own badge, core at the root.
          find site/coverage -name coverage.xml | while read -r report; do
            python .github/scripts/coverage_badge.py "$report" "$(dirname "$report")/badge.json"
          done

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
