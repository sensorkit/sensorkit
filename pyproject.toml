[project]
name = "sensorkit"
dynamic = ["version"]
description = "Autonomous observatory control for space domain awareness and time-domain astronomy: hardware drivers, satellite tracking, scheduling, and safety automation, distributed over NATS."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Erik Small", email = "erik.small@ensc.dev" },
    { name = "Ryan Swindle", email = "ryanswindle@odysseyconsult.com" },
    { name = "David Zeleniak", email = "david.zeleniak@e-o.solutions" },
]
requires-python = ">=3.13"
keywords = [
    "astronomy",
    "observatory",
    "telescope",
    "automation",
    "space-domain-awareness",
    "satellite-tracking",
    "ascom",
    "alpaca",
    "nats",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "aiofile>=3.9.0",
    "astropy>=7.1.0",
    "asyncclick==8.1.8",
    "fastapi>=0.115.12",
    "intervaltree>=3.1.0",
    "loguru~=0.7",
    "nats-py==2.14",
    "pillow>=12.0.0",
    "pydantic~=2.11",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=14.0.0",
    "satkit>=0.8.3",
    "scipy>=1.16.3",
    "skyfield>=1.53",
    "tzdata>=2025.2",
    "uuid-utils>=0.11.0",
    "uvicorn>=0.34.0",
    "watchdog>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/sensorkit/sensorkit"
Repository = "https://github.com/sensorkit/sensorkit"
Issues = "https://github.com/sensorkit/sensorkit/issues"

[project.scripts]
sensorkit = "sensorkit.cli.__main__:root"

[project.optional-dependencies]
filesys = []
alpaca = [
    "alpyca>=3.1.1",
    "numpy>=1.24.0",
]
autoslew = [
    "sensorkit[alpaca]",
]
burr = [
    "astro-burr",
]
indigo = [
    "websockets>=14.0",
]
nina = [
    "httpx",
]
node-platform = [
    "ourskyai-node-platform-api>=1.4.61",
]
otto = [
    "google-auth",
    "google-api-python-client",
    "google-auth-oauthlib",
    "dropbox",
    "udl-sdk",
]
pwi4 = [
    "httpx",
]
sdasim = [
    "numpy>=1.24.0",
    "sdasim",
]
sky-transmission = [
    "allclear",
    "alpyca>=3.1.0",
    "imageio[pyav]",
    "matplotlib",
]
senpai = [
    "astro-senpai>=2.3.1",
]
slack = [
    "slack-sdk",
    "aiohttp",
]
systemd = [
    "systemd-python==235; sys_platform == 'linux'",
]
thesky = []
thesky-simulator = [
    "dukpy>=0.5.0",
]
webapi = []
udl = [
    "udl-sdk",
    "httpx",
]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "httpx>=0.28.0",
    "import-linter>=2.1",
    "pygtrie>=2.5.0",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.1.1",
    "pytest-httpserver>=1.1.2",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.4.0",
    "pytest>=8.3.4",
    "ruff~=0.9",
    "sensorkit[thesky-simulator]",
    "testcontainers[nats]>=4.9.0",
    "zensical>=0.0.1",
]

[[tool.uv.dependency-metadata]]
name = "systemd-python"
version = "235"
requires-dist = []

[tool.ruff]
include = ["core/**/*.py", "modules/**/*.py"]
line-length = 99
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "C901"]
ignore = ["E501", "E203", "B027", "B019"]
unfixable = ["B"]

[tool.ruff.lint.isort]
known-first-party = ["sensorkit"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "localonly: test requires ENV=local",
    "docker: test requires a Docker daemon running Linux containers",
]
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.report]
include_namespace_packages = true

[tool.importlinter]
root_packages = ["sensorkit"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "SensorKit layers are intact"
type = "layers"
# The udl EO publisher consumes senpai's published SenpaiResult keyword; the
# models module is pydantic-only (no astro-senpai import).
ignore_imports = [
    "sensorkit.udl.publishers -> sensorkit.senpai.models",
    "sensorkit.autoslew.** -> sensorkit.alpaca.**",
]
layers = [
    """
    sensorkit.alpaca |
    sensorkit.autoslew |
    sensorkit.burr |
    sensorkit.indigo |
    sensorkit.nina |
    sensorkit.node_platform |
    sensorkit.otto |
    sensorkit.pwi4 |
    sensorkit.sdasim |
    sensorkit.senpai |
    sensorkit.sky_transmission |
    sensorkit.slack |
    sensorkit.thesky |
    sensorkit.udl
    """,
    "sensorkit.cli",
    "sensorkit.webapi",
    "sensorkit.std",
    "sensorkit.auto",
    "sensorkit.astro",
    "sensorkit.api",
    "sensorkit.core : sensorkit.data",
    "sensorkit.backend",
    "sensorkit.common",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "core",
    "hatch_build.py",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.sdist.force-include]
"modules" = "modules"

[tool.hatch.build.targets.wheel]
packages = ["core/src/sensorkit"]
dev-mode-dirs = [
    "core/src",
    "modules/alpaca/src",
    "modules/autoslew/src",
    "modules/burr/src",
    "modules/indigo/src",
    "modules/nina/src",
    "modules/node_platform/src",
    "modules/otto/src",
    "modules/pwi4/src",
    "modules/sdasim/src",
    "modules/senpai/src",
    "modules/sky_transmission/src",
    "modules/slack/src",
    "modules/thesky/src",
    "modules/udl/src",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
modules = [
    "alpaca",
    "autoslew",
    "burr",
    "indigo",
    "nina",
    "node_platform",
    "otto",
    "pwi4",
    "sdasim",
    "senpai",
    "sky_transmission",
    "slack",
    "thesky",
    "udl",
]
subpackage-path = "modules/{module}/src/sensorkit/{module}"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"
