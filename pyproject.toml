[project]
name = "sensorkit"
dynamic = ["version"]
description = "SensorKit"
readme = "README.md"
authors = [
    { name = "Erik Small", email = "erik.small@ensc.dev" },
    { name = "David Zeleniak", email = "david.zeleniak@e-o.solutions" },
    { name = "Ryan Swindle", email = "ryanswindle@odysseyconsult.com" }
]
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.1.0",
    "asyncclick==8.1.8",
    "intervaltree>=3.1.0",
    "loguru~=0.7",
    "nats-py~=2.13",
    "pillow>=12.0.0",
    "pydantic~=2.11",
    "python-dateutil>=2.9.0.post0",
    "rich>=14.0.0",
    "satkit>=0.8.3",
    "scipy>=1.16.3",
    "skyfield>=1.53",
    "tzdata>=2025.2",
    "uuid-utils>=0.11.0",
]

[project.scripts]
sensorkit = "sensorkit.cli.__main__:root"

[project.optional-dependencies]
filesys = [
    "aiofile>=3.9.0",
    "watchdog>=6.0.0",
]
alpaca = [
    "alpyca>=3.1.1",
    "numpy>=1.24.0",
]
node-platform = [
    "ourskyai-node-platform-api<=1.3.9953",
]
otto = [
    "google-auth",
    "google-api-python-client",
    "google-auth-oauthlib",
    "dropbox",
    "udl-sdk",
]
pwi4 = [
    "httpx<=0.28.0",
]
thesky = []
thesky-simulator = [
    "click>=8.1.8",
    "dukpy>=0.5.0",
]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "import-linter>=2.1",
    "pygtrie>=2.5.0",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.1.1",
    "pytest-httpserver>=1.1.2",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.4.0",
    "pytest>=8.3.4",
    "ruff~=0.9",
    "testcontainers[nats]>=4.9.0",
    "zensical>=0.0.1",
]

[tool.ruff]
include = ["core/**/*.py", "modules/**/*.py"]
line-length = 99
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "C901"]
ignore = ["E501", "E203", "B027", "B019"]
unfixable = ["B"]

[tool.ruff.lint.isort]
known-first-party = ["sensorkit"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = ["localonly: test requires ENV=local"]
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning"]

[tool.importlinter]
root_packages = ["sensorkit"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "SensorKit layers are intact"
type = "layers"
layers = [
    """
    sensorkit.alpaca |
    sensorkit.node_platform |
    sensorkit.otto |
    sensorkit.pwi4 |
    sensorkit.thesky
    """,
    "sensorkit.cli",
    "sensorkit.webapi",
    "sensorkit.auto",
    "sensorkit.std",
    #"sensorkit.astro", # FIXME: Temporary model imports in sensorkit.api break this check.
    "sensorkit.api",
    "sensorkit.core : sensorkit.data",
    "sensorkit.backend",
    "sensorkit.common",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["core/src/sensorkit"]
dev-mode-dirs = [
    "core/src",
    "modules/alpaca/src",
    "modules/node_platform/src",
    "modules/otto/src",
    "modules/pwi4/src",
    "modules/thesky/src",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
modules = [
    "alpaca",
    "node_platform",
    "otto",
    "pwi4",
    "thesky",
]
subpackage-path = "modules/{module}/src/sensorkit/{module}"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
